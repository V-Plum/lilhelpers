<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Little Helpers</title>
<style>
  :root { --bg: #ffffff; --fg: #1f1f23; --dim: #6b6b75; --ok: #2e7d32; --no: #b3261e; --line: #e4e4e8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #2b2b2e; --fg: #f0f0f0; --dim: #a0a0a8; --ok: #81c784; --no: #ef9a9a; --line: #45454b; } }
  body { margin: 0; padding: 12px 14px; width: 280px; background: var(--bg); color: var(--fg); font: 13px "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 14px; margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
  h1 img { width: 20px; height: 20px; }
  .row { display: flex; justify-content: space-between; padding: 4px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .k { color: var(--dim); }
  .ok { color: var(--ok); } .no { color: var(--no); }
  p { color: var(--dim); margin: 8px 0 0; line-height: 1.35; }
  button { margin-top: 10px; width: 100%; padding: 6px; font: inherit; }
</style>
</head>
<body>
<h1><img src="icon32.png" alt=""><span data-i="title">Little Helpers</span></h1>
<div class="row"><span class="k" data-i="lh">Little Helpers</span><span id="conn">…</span></div>
<div class="row"><span class="k" data-i="rec">Запис</span><span id="rec">…</span></div>
<p id="hint"></p>
<button id="report" data-i="open">Відкрити звіт…</button>
<script src="popup.js"></script>
</body>
</html>
